name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake shellcheck
      - run: npm ci || npm install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-build-all
          key: emsdk-${{ hashFiles('flavors.json', 'patches/**') }}
      - run: ./cli.mjs setup --browsers
      - run: npm test
